# OpenSSF Scorecard: supply-chain health of the repository, published to scorecard.dev.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:
  branch_protection_rule:

permissions: {}

jobs:
  analysis:
    # Scorecard only analyzes and publishes public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to code scanning
      id-token: write # publish the results to scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
